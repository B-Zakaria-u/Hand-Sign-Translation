[versions]
androidGradlePlugin  = "8.11.1"
kotlin               = "2.1.20"
ksp                  = "2.1.20-1.0.32"
coreKtx              = "1.16.0"
appcompat            = "1.7.0"
material             = "1.12.0"
fragment             = "1.8.8"
lifecycle            = "2.9.1"
navigation           = "2.9.0"
cameraX              = "1.4.2"
mediapipe            = "0.10.14"
tflite               = "2.16.1"
tfliteGpu            = "2.16.1"
tfliteSupport        = "0.4.4"
onnx                 = "1.22.0"
torchMobile          = "2.1.0"
room                 = "2.7.1"
hilt                 = "2.56.2"
hiltWork             = "1.2.0"
work                 = "2.10.1"
okhttp               = "4.12.0"
gson                 = "2.13.1"
datastore            = "1.1.2"
coroutines           = "1.10.2"
constraintlayout     = "2.2.1"
recyclerview         = "1.4.0"
activity             = "1.10.1"
startup              = "1.2.0"
junit                = "4.13.2"
junitExt             = "1.2.1"
espresso             = "3.6.1"

[libraries]
# AndroidX Core
core-ktx                = { group = "androidx.core",              name = "core-ktx",                  version.ref = "coreKtx" }
appcompat               = { group = "androidx.appcompat",          name = "appcompat",                 version.ref = "appcompat" }
material                = { group = "com.google.android.material", name = "material",                  version.ref = "material" }
fragment-ktx            = { group = "androidx.fragment",           name = "fragment-ktx",              version.ref = "fragment" }
activity-ktx            = { group = "androidx.activity",           name = "activity-ktx",              version.ref = "activity" }
constraintlayout        = { group = "androidx.constraintlayout",   name = "constraintlayout",          version.ref = "constraintlayout" }
recyclerview            = { group = "androidx.recyclerview",       name = "recyclerview",              version.ref = "recyclerview" }
startup                 = { group = "androidx.startup",            name = "startup-runtime",           version.ref = "startup" }

# Lifecycle
lifecycle-vm-ktx        = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-ktx",   version.ref = "lifecycle" }
lifecycle-rt-ktx        = { group = "androidx.lifecycle",          name = "lifecycle-runtime-ktx",     version.ref = "lifecycle" }
lifecycle-livedata      = { group = "androidx.lifecycle",          name = "lifecycle-livedata-ktx",    version.ref = "lifecycle" }

# Navigation
nav-fragment            = { group = "androidx.navigation",         name = "navigation-fragment-ktx",   version.ref = "navigation" }
nav-ui                  = { group = "androidx.navigation",         name = "navigation-ui-ktx",         version.ref = "navigation" }

# CameraX
camera-camera2          = { group = "androidx.camera",             name = "camera-camera2",            version.ref = "cameraX" }
camera-lifecycle        = { group = "androidx.camera",             name = "camera-lifecycle",          version.ref = "cameraX" }
camera-view             = { group = "androidx.camera",             name = "camera-view",               version.ref = "cameraX" }

# MediaPipe
mediapipe-tasks         = { group = "com.google.mediapipe",        name = "tasks-vision",              version.ref = "mediapipe" }

# TFLite
tflite-core             = { group = "org.tensorflow",              name = "tensorflow-lite",           version.ref = "tflite" }
tflite-gpu              = { group = "org.tensorflow",              name = "tensorflow-lite-gpu",       version.ref = "tfliteGpu" }
tflite-support          = { group = "org.tensorflow",              name = "tensorflow-lite-support",   version.ref = "tfliteSupport" }

# ONNX Runtime
onnx-runtime            = { group = "com.microsoft.onnxruntime",   name = "onnxruntime-android",       version.ref = "onnx" }

# PyTorch Mobile
torch-mobile            = { group = "org.pytorch",                 name = "pytorch_android_lite",      version.ref = "torchMobile" }

# Room (SQLite)
room-runtime            = { group = "androidx.room",               name = "room-runtime",              version.ref = "room" }
room-ktx                = { group = "androidx.room",               name = "room-ktx",                  version.ref = "room" }
room-compiler           = { group = "androidx.room",               name = "room-compiler",             version.ref = "room" }

# Hilt DI
hilt-android            = { group = "com.google.dagger",           name = "hilt-android",              version.ref = "hilt" }
hilt-compiler           = { group = "com.google.dagger",           name = "hilt-compiler",             version.ref = "hilt" }
hilt-work               = { group = "androidx.hilt",               name = "hilt-work",                 version.ref = "hiltWork" }
hilt-work-compiler      = { group = "androidx.hilt",               name = "hilt-compiler",             version.ref = "hiltWork" }

# WorkManager
work-runtime-ktx        = { group = "androidx.work",               name = "work-runtime-ktx",          version.ref = "work" }

# Network
okhttp                  = { group = "com.squareup.okhttp3",         name = "okhttp",                    version.ref = "okhttp" }
gson                    = { group = "com.google.code.gson",         name = "gson",                      version.ref = "gson" }

# DataStore
datastore               = { group = "androidx.datastore",           name = "datastore-preferences",      version.ref = "datastore" }
datastore-core          = { group = "androidx.datastore",           name = "datastore-preferences-core", version.ref = "datastore" }

# Coroutines
coroutines-android      = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Test
junit                   = { group = "junit",                        name = "junit",                     version.ref = "junit" }
junit-ext               = { group = "androidx.test.ext",            name = "junit",                     version.ref = "junitExt" }
espresso-core           = { group = "androidx.test.espresso",       name = "espresso-core",             version.ref = "espresso" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-test",   version.ref = "coroutines" }

[plugins]
android-application     = { id = "com.android.application",             version.ref = "androidGradlePlugin" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
ksp                     = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
hilt                    = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
# google-services       = { id = "com.google.gms.google-services",      version = "4.4.2" }